name: wif-debug
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC token claims
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=iam.googleapis.com/projects/80693608388/locations/global/workloadIdentityPools/github/providers/github-oidc" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
import json,sys,base64
claims=json.loads(base64.urlsafe_b64decode(sys.stdin.read()+'=='))
for k in ('sub','repository','repository_owner','ref','aud','iss'): print(k,'=',claims.get(k))
"
      - name: WIF exchange + impersonation (curl, verbatim)
        run: |
          OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=iam.googleapis.com/projects/80693608388/locations/global/workloadIdentityPools/github/providers/github-oidc" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          STS=$(curl -sf -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "{
            \"grantType\": \"urn:ietf:params:oauth:grant-type:token-exchange\",
            \"audience\": \"//iam.googleapis.com/projects/80693608388/locations/global/workloadIdentityPools/github/providers/github-oidc\",
            \"scope\": \"https://www.googleapis.com/auth/cloud-platform\",
            \"requestedTokenType\": \"urn:ietf:params:oauth:token-type:access_token\",
            \"subjectTokenType\": \"urn:ietf:params:oauth:token-type:jwt\",
            \"subjectToken\": \"$OIDC\"
          }" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "STS exchange OK"
          curl -s -X POST "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/fa-network-deploy@ai-native-478811.iam.gserviceaccount.com:generateAccessToken" \
            -H "Authorization: Bearer $STS" -H 'Content-Type: application/json' \
            -d '{"scope": ["https://www.googleapis.com/auth/cloud-platform"]}' | head -c 200
