name: wif-debug
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/wif-debug.yml"]
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Cross-test impersonation matrix
        run: |
          OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=//iam.googleapis.com/projects/80693608388/locations/global/workloadIdentityPools/github-dap/providers/dap-oidc" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          for SA in dap-deploy@ai-native-478811.iam.gserviceaccount.com fa-network-deploy@ai-native-478811.iam.gserviceaccount.com; do
            STS=$(curl -s -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' -d "{\"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"audience\":\"//iam.googleapis.com/projects/80693608388/locations/global/workloadIdentityPools/github-dap/providers/dap-oidc\",\"scope\":\"https://www.googleapis.com/auth/cloud-platform\",\"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",\"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",\"subjectToken\":\"$OIDC\"}")
            STSTOK=$(echo "$STS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
            [ -z "$STSTOK" ] && { echo "$SA: STS FAILED"; continue; }
            R=$(curl -s -X POST "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SA:generateAccessToken" -H "Authorization: Bearer $STSTOK" -H 'Content-Type: application/json' -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}')
            echo "$SA: $(echo "$R" | python3 -c "import json,sys; d=json.load(sys.stdin); print('OK' if 'accessToken' in d else d.get('error',{}).get('code'))" 2>/dev/null || echo parse-fail)"
          done
