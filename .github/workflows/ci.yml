name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache: true
          cache-dependency-path: hub/go.sum

      # Measured max: hub/relay.go at 417 lines; threshold = next round 500.
      - name: File size guard (no hub/*.go file over 500 lines)
        run: |
          violations=$(find hub -name '*.go' \
            -exec sh -c 'lines=$(wc -l < "$1"); if [ "$lines" -gt 500 ]; then echo "$1: $lines lines"; fi' _ {} \;)
          if [ -n "$violations" ]; then echo "$violations"; exit 1; fi

      - name: go vet
        working-directory: hub
        run: go vet ./...

      - name: go test with coverage
        working-directory: hub
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: CRAP gate (crap4go, max 12 — mirrors .githooks/pre-commit)
        run: |
          mkdir -p bin .tools
          git clone --depth 1 https://github.com/vabhzw17eg2qu4m9-bit/crap4go .tools/crap4go
          (cd .tools/crap4go && go build -o ../../bin/crap4go .)
          (cd hub && ../bin/crap4go --run-tests --threshold 12 .)

      # Measured: 3.02% on 2026-08-31; threshold = max(1.0, next 0.5) = 3.5.
      - name: Duplication guard (hub/ < 3.5%)
        run: |
          npx --yes jscpd@5 --min-tokens 50 --min-lines 5 --reporters json \
            --output /tmp/jscpd-ci hub/ || true
          python3 - <<'EOF'
          import json, sys
          try:
              with open('/tmp/jscpd-ci/jscpd-report.json') as f:
                  pct = json.load(f)['statistics']['total']['percentage']
          except Exception:
              pct = 0.0
          print(f'Duplication: {pct}% (threshold < 3.5%)')
          sys.exit(0 if float(pct) < 3.5 else 1)
          EOF

  binaries:
    name: Continuous binaries
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache: true
          cache-dependency-path: hub/go.sum

      - name: Cross-compile 6 platforms (CGO-free)
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            dir="dist/dap-hub_${os}_${arch}"
            mkdir -p "$dir"
            (cd hub && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "../$dir/dap-hub$ext" .)
            cp LICENSE "$dir/LICENSE"
          done

      - name: Archive and checksum
        # Staging dirs are removed after archiving so dist/ holds only files
        # (gh release cannot upload directories; `dist/*` stays valid).
        run: |
          for d in dist/dap-hub_*/; do
            base=$(basename "$d")
            case "$base" in
              *_windows_*) (cd dist && zip -q -r "$base.zip" "$base") ;;
              *) tar -czf "dist/$base.tar.gz" -C dist "$base" ;;
            esac
          done
          rm -rf dist/dap-hub_*/
          (cd dist && sha256sum dap-hub_*.tar.gz dap-hub_*.zip > sha256sums.txt)
          ls -lh dist

      - name: Publish rolling release (continuous)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --cleanup-tag -y || true
          gh release create continuous dist/* \
            --target $GITHUB_SHA \
            --prerelease \
            --title "Continuous build" \
            --notes "Automated build from main@${GITHUB_SHA:0:7}. Binaries: 6 platforms + sha256sums.txt."

  docker:
    name: Multi-arch image (ghcr.io)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # No qemu: hub/Dockerfile cross-compiles via TARGETARCH (CGO-free).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build single-arch image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/vabhzw17eg2qu4m9-bit/dap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/vabhzw17eg2qu4m9-bit/dap:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Only runs if the scan passed.
      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vabhzw17eg2qu4m9-bit/dap:latest
            ghcr.io/vabhzw17eg2qu4m9-bit/dap:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
